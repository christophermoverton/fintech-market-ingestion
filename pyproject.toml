[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-market-ingestion"
version = "0.6.0"
description = "Market data ingestion and validation framework for Alpaca OHLCV bars and corporate-action dividend evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Christopher M Overton" }
]
keywords = [
  "alpaca",
  "duckdb",
  "market-data",
  "parquet",
  "python",
  "quantitative-finance"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.2",
  "pandas-market-calendars>=5.0",
  "pyarrow>=15.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8"
]

[project.scripts]
fintech-ingest-corporate-actions = "src.cli.ingest_corporate_actions:main"

[project.urls]
Homepage = "https://github.com/christophermoverton/fintech-market-ingestion"
Repository = "https://github.com/christophermoverton/fintech-market-ingestion"
Issues = "https://github.com/christophermoverton/fintech-market-ingestion/issues"
Documentation = "https://github.com/christophermoverton/fintech-market-ingestion/tree/main/docs"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "data",
  "artifacts",
  "reports",
  "dist",
  "build",
  ".venv",
  "venv",
  "*.egg-info"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/corporate_actions_dividend_ingestion_example.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"
