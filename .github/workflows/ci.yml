name: CI

on:
  pull_request:
    branches:
      - main
      - "feature/m*"
  push:
    branches:
      - main
      - "feature/m*"

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with development dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest tests -q

      - name: Run M3 corporate-actions regression validation
        run: pytest tests/test_m3_corporate_actions_validation.py -q

      - name: Run Ruff lint check
        run: ruff check src tests examples

      - name: Run Ruff format check
        run: ruff format --check src tests examples

      - name: Run py_compile smoke check
        run: python -m py_compile src/cli/ingest_corporate_actions.py

      - name: Run module CLI help smoke check
        run: python -m src.cli.ingest_corporate_actions --help

      - name: Run installed console script help smoke check
        run: fintech-ingest-corporate-actions --help
